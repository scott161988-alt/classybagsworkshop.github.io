<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy Bags Workshop</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #2e7d32;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (min-width: 480px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-main);
            text-decoration: none;
            padding: 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn span {
            font-size: 0.75rem;
            font-weight: normal;
            color: var(--text-sub);
            margin-top: 5px;
        }

        .btn:hover {
            border-color: var(--accent-green);
            background-color: #222;
        }

        .btn-full {
            grid-column: 1 / -1;
            background-color: var(--accent-green);
            border: none;
        }

        .btn-full:hover {
            background-color: #1b5e20;
        }

        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: var(--text-sub);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Classy Bags Workshop</h1>
        <p class="subtitle">Premium Sourcing & Vintage Restoration • London</p>

        <div class="grid">
            <div onclick="routeDept('bags')" class="btn">
                👜 Handbag Department
                <span>Browse Leather & Designer Assets</span>
            </div>
            
            <div onclick="routeDept('cameras')" class="btn">
                📷 Tech & Camera Lab
                <span>Browse Sony Hardware & Optics</span>
            </div>

            <div onclick="routeDept('all')" class="btn btn-full">
                🌐 View Full Showroom Inventory
            </div>
        </div>

        <footer>
            SECURE PLATFORM CHECKOUT POWERED BY EBAY
        </footer>
    </div>

    <script>
        function routeDept(department) {
            // Replace YOUR_EBAY_USERNAME with your actual eBay username text
            const destinations = {
                'bags': 'https://ebay.co.uk',
                'cameras': 'https://ebay.co.uk',
                'all': 'https://ebay.co.uk'
            };

            if (destinations[department]) {
                window.location.href = destinations[department];
            }
        }
    </script>

</body>
</html>
